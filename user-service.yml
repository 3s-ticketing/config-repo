server:
  port: ${USER_SERVICE_PORT:${USER_PORT:20001}}

spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:15432}/${DB_NAME:ticketing}?currentSchema=${DB_SCHEMA:user_service}
    username: ${DB_USERNAME:ticketing}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:user_service}
        hbm2ddl:
          create_schemas: true
    show-sql: ${JPA_SHOW_SQL:true}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:18080/realms/ticketing}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:18080/realms/ticketing/protocol/openid-connect/certs}

eureka:
  client:
    enabled: true
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:10001/eureka/}
