server:
  port: ${PAYMENT_SERVICE_PORT:${PAYMENT_PORT:20006}}

spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:15432}/${DB_NAME:ticketing}?currentSchema=${DB_SCHEMA:payment_service}
    username: ${DB_USERNAME:ticketing}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:payment_service}
        hbm2ddl:
          create_schemas: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

eureka:
  client:
    enabled: true
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:10001/eureka/}

toss:
  secret-key: ${TOSS_SECRET_KEY}

management:
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}


feign:
  circuitbreaker:
    enabled: true

resilience4j:
  circuitbreaker:
    instances:
      toss:
        sliding-window-size: 10                      # 최근 10건 기준으로 실패율 계산
        failure-rate-threshold: 50                   # 50% 이상 실패 → OPEN
        wait-duration-in-open-state: 10s             # 10초 대기 후 HALF-OPEN 전환
        permitted-number-of-calls-in-half-open-state: 3  # HALF-OPEN에서 3건 시도 후 판단
        register-health-indicator: true
