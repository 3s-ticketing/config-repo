server:
  port: ${GATEWAY_PORT:10000}

spring:
  application:
    name: gateway-service

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:18080/realms/ticketing}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://keycloak:8080/realms/ticketing/protocol/openid-connect/certs}

  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:3000"
                  - "http://127.0.0.1:3000"
                  - "http://localhost:5173"
                  - "http://127.0.0.1:5173"
                  - "http://ticketing-alb-1966117378.ap-northeast-2.elb.amazonaws.com"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                exposedHeaders:
                  - Authorization
                maxAge: 3600

          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/users,/api/users/**,/api/auth,/api/auth/**

            - id: club-service
              uri: lb://club-service
              predicates:
                - Path=/api/clubs,/api/clubs/**,/api/stadiums,/api/stadiums/**

            - id: match-service
              uri: lb://match-service
              predicates:
                - Path=/api/matches,/api/matches/**

            - id: seat-service
              uri: lb://seat-service
              predicates:
                - Path=/api/seats,/api/seats/**,/api/seat-grades,/api/seat-grades/**

            - id: reservation-service
              uri: lb://reservation-service
              predicates:
                - Path=/api/reservations,/api/reservations/**,/api/reservation-seats,/api/reservation-seats/**

            - id: queue-service
              uri: lb://queue-service
              predicates:
                - Path=/api/queues,/api/queues/**

            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/payments,/api/payments/**,/payment-test.html

eureka:
  client:
    enabled: true
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:10001/eureka/}
      
